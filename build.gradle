plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"tomyen" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		configureEach {
			// Hot reload: JetBrains Runtime can hotswap added/removed methods, fields and classes.
			// IgnoreUnrecognizedVMOptions keeps runs working on non-JBR JDKs (method-body-only hotswap there).
			vmArg "-XX:+IgnoreUnrecognizedVMOptions"
			vmArg "-XX:+AllowEnhancedClassRedefinition"
		}

		// Same as the client run, but listens for the `hotswap` task on a local debug port.
		clientHotswap {
			inherit client
			name "Minecraft Client (hotswap)"
			vmArg "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:${hotswap_port}"
			ideConfigGenerated false
		}
	}
}

sourceSets {
	hotswap {
		java.srcDirs = ["tools/hotswap"]
	}
}

def hotswapArgs = [
		hotswap_port,
		layout.buildDirectory.file("hotswap/hashes.properties").get().asFile.path,
		layout.buildDirectory.dir("classes/java/main").get().asFile.path,
		layout.buildDirectory.dir("classes/java/client").get().asFile.path,
]

// Records which class versions the game launches with, so `hotswap` only pushes real changes.
tasks.register("hotswapBaseline", JavaExec) {
	dependsOn "classes", "clientClasses"
	classpath = sourceSets.hotswap.runtimeClasspath
	mainClass = "HotSwap"
	args(["--baseline"] + hotswapArgs)
}

tasks.matching { it.name == "runClientHotswap" }.configureEach {
	dependsOn "hotswapBaseline"
}

// Recompile, then push changed classes and resources into a game started with runClientHotswap.
// Press F3+T in game to reload textures/models/lang, or run /reload for recipes and other data.
tasks.register("hotswap", JavaExec) {
	group = "fabric"
	description = "Hot-reloads changed code into a running runClientHotswap game."
	dependsOn "classes", "clientClasses", "processResources", "processClientResources"
	classpath = sourceSets.hotswap.runtimeClasspath
	mainClass = "HotSwap"
	args hotswapArgs
}

// Mixin hotswap needs the Mixin jar attached as a java agent.
afterEvaluate {
	def mixinJar = configurations.compileClasspath.find { it.name.startsWith("sponge-mixin") }
	loom.runs.configureEach {
		vmArg "-javaagent:${mixinJar}"
		vmArg "-Dmixin.hotSwap=true"
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
