# Builds the mod on every push and pull request to master, and keeps the jars as a
# downloadable artifact on the run's summary page.

name: build
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - name: setup jdk
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      # Also validates the Gradle wrapper jar and caches ~/.gradle (Minecraft, Loom, dependencies).
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
      - name: build
        run: ./gradlew build
      - name: upload jars
        uses: actions/upload-artifact@v7
        with:
          name: tomyen-jars
          path: build/libs/*.jar
          if-no-files-found: error
